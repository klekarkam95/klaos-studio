<style>
:root{--bg:#FAFAF8;--ink:#111214;--muted:#5E6068;--accent:#2A3DE0;--line:#E4E4E0}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--ink:#FAFAF8;--muted:#A3A5AD;--accent:#8090FF;--line:#2A2B30}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 "Instrument Sans",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:min(560px,100%);display:flex;flex-direction:column;gap:28px}
.lg{width:min(320px,80%);height:auto;color:var(--ink)}
.tag{font:500 12px/1.4 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
p{margin:0;color:var(--muted)}
ul{list-style:none;margin:0;padding:20px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 28px}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
a:hover{border-color:currentColor}
</style>
